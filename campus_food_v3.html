<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>觅食</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FAF8FF;
  --cream:#FAF8FF;
  --cream2:#F2EFF9;
  --ink:#1E1A2E;
  --ink2:#3D3758;
  --ink3:#8C87A8;
  --sage:#7B68EE;
  --sage-light:#EFEDFF;
  --gold:#9B7FE8;
  --gold-light:#F0ECFF;
  --red:#C0392B;
  --border:#E2DDF5;
  --white:#FFFFFF;
  --lavender:#8B7ED8;
  --lavender-deep:#6B5EC7;
  --lavender-pale:#EDE9FF;
  --card-shadow:0 6px 28px rgba(107,94,199,.12);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Noto Sans SC',sans-serif}

/* ===================== SCREENS ===================== */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;pointer-events:none;opacity:0;transform:translateY(30px);transition:opacity .42s cubic-bezier(.4,0,.2,1),transform .42s cubic-bezier(.4,0,.2,1)}
.screen.active{pointer-events:all;opacity:1;transform:translateY(0)}
.screen.exit-up{opacity:0;transform:translateY(-24px);pointer-events:none}
.screen.exit-down{opacity:0;transform:translateY(30px);pointer-events:none}

/* ===================== SCREEN 1: SPLASH ===================== */
#s-splash{background:#2D2640;align-items:center;justify-content:center}

.splash-ambient{position:absolute;inset:0;overflow:hidden}
.amb1{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(139,126,216,.28) 0%,transparent 65%);top:-150px;left:-100px}
.amb2{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(107,94,199,.22) 0%,transparent 65%);bottom:-80px;right:-80px}
.amb3{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(240,236,255,.06) 0%,transparent 70%);top:40%;left:50%;transform:translate(-50%,-50%)}
.splash-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(240,236,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(240,236,255,.04) 1px,transparent 1px);background-size:36px 36px}

.splash-center{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}

/* ---- SVG LOGO MARK ---- */
.logo-mark{
  width:110px;height:110px;
  opacity:0;
  animation:logoIn .9s cubic-bezier(.2,1,.3,1) .4s forwards;
}
@keyframes logoIn{from{opacity:0;transform:scale(.5) rotate(-15deg)}to{opacity:1;transform:scale(1) rotate(0)}}

.logo-rings{
  position:absolute;
  width:110px;height:110px;
  top:0;left:50%;transform:translateX(-50%);
}
.lr1,.lr2,.lr3{position:absolute;border-radius:50%;border:1px solid;top:50%;left:50%;transform:translate(-50%,-50%);animation:ringBreath 4s ease-in-out infinite}
.lr1{width:110px;height:110px;border-color:rgba(139,126,216,.5);animation-delay:0s}
.lr2{width:148px;height:148px;border-color:rgba(139,126,216,.22);animation-delay:.5s}
.lr3{width:186px;height:186px;border-color:rgba(139,126,216,.1);animation-delay:1s}
@keyframes ringBreath{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.04)}}

.logo-wrap{
  position:relative;
  width:110px;height:110px;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:40px;
}

.splash-wordmark{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  opacity:0;animation:fadeUp .8s ease .9s forwards;
}
.splash-name{font-family:'Noto Serif SC',serif;font-size:54px;font-weight:600;color:#FAF8FF;letter-spacing:14px;text-indent:14px}
.splash-en{font-size:13px;color:rgba(240,236,255,.55);letter-spacing:3px;font-weight:300}

.splash-rule{width:1px;height:44px;background:linear-gradient(to bottom,transparent,rgba(240,236,255,.25),transparent);margin:28px 0;opacity:0;animation:fadeIn .5s ease 1.3s forwards}
.splash-slogan{font-size:12px;color:rgba(240,236,255,.45);letter-spacing:3px;font-weight:300;opacity:0;animation:fadeIn .5s ease 1.4s forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{to{opacity:1}}

.splash-cta{margin-top:52px;opacity:0;animation:fadeUp .7s ease 1.6s forwards}
.enter-btn{
  display:flex;align-items:center;gap:12px;
  padding:14px 44px;background:#FAF8FF;border:none;border-radius:50px;
  font-size:15px;font-family:'Noto Sans SC',sans-serif;font-weight:500;
  color:var(--ink);letter-spacing:2px;cursor:pointer;
  box-shadow:0 8px 36px rgba(45,38,64,.45);
  transition:transform .2s cubic-bezier(.2,1,.3,1),box-shadow .2s;
}
.enter-btn:hover{transform:translateY(-2px);box-shadow:0 14px 44px rgba(45,38,64,.55)}
.enter-btn:active{transform:scale(.97)}
.enter-arrow{font-size:14px;transition:transform .2s}
.enter-btn:hover .enter-arrow{transform:translateX(3px)}

.splash-version{position:absolute;bottom:28px;font-size:10px;color:rgba(240,236,255,.18);letter-spacing:3px}

/* ===================== SCREEN 2: FILTER ===================== */
#s-filter{background:var(--cream);overflow:hidden}
.filter-scroll{flex:1;overflow-y:auto;padding-bottom:120px}
.filter-scroll::-webkit-scrollbar{display:none}

.fh{padding:54px 24px 12px;background:var(--cream)}
.fh-back{background:none;border:none;font-size:12px;color:var(--ink3);cursor:pointer;letter-spacing:1.5px;padding:0;margin-bottom:14px;display:flex;align-items:center;gap:4px}
.fh-title{font-family:'Noto Serif SC',serif;font-size:27px;font-weight:600;color:var(--ink);line-height:1.35}
.fh-sub{font-size:13px;color:var(--ink3);margin-top:6px;line-height:1.65}

.fb{padding:4px 24px}
.sec-label{
  font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:3px;
  margin:28px 0 12px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{
  padding:9px 17px;border-radius:50px;border:1px solid var(--border);
  background:var(--white);font-size:13px;color:var(--ink2);
  cursor:pointer;transition:all .17s;font-family:'Noto Sans SC',sans-serif;white-space:nowrap;
}
.tag:active{transform:scale(.94)}
.tag.on-scene{background:var(--lavender-deep);border-color:var(--lavender-deep);color:var(--white)}
.tag.on-mood{background:var(--lavender);border-color:var(--lavender);color:var(--white)}
.price-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ptag{
  padding:11px 4px;border-radius:13px;border:1px solid var(--border);
  background:var(--white);text-align:center;font-size:13px;color:var(--ink2);
  cursor:pointer;transition:all .17s;font-family:'Noto Sans SC',sans-serif;
}
.ptag .ps{font-size:10px;color:var(--ink3);margin-top:3px}
.ptag.on-price{background:var(--lavender-deep);border-color:var(--lavender-deep);color:var(--white)}
.ptag.on-price .ps{color:rgba(255,255,255,.45)}
.mood-ta{
  width:100%;padding:14px 16px;border:1px solid var(--border);border-radius:15px;
  background:var(--white);font-size:13.5px;color:var(--ink);
  font-family:'Noto Sans SC',sans-serif;resize:none;outline:none;line-height:1.7;
  transition:border-color .2s;
}
.mood-ta:focus{border-color:var(--lavender)}
.mood-ta::placeholder{color:var(--ink3)}

.filter-foot{position:fixed;bottom:0;left:0;right:0;padding:16px 24px 36px;background:linear-gradient(transparent,var(--cream) 30%);z-index:20}
.rec-btn{
  width:100%;padding:15px;background:linear-gradient(135deg,var(--lavender-deep),var(--lavender));color:var(--white);border:none;
  border-radius:15px;font-size:15px;font-family:'Noto Sans SC',sans-serif;
  font-weight:500;cursor:pointer;letter-spacing:1.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s;box-shadow:0 6px 24px rgba(107,94,199,.4);
}
.rec-btn:active{transform:scale(.98)}
.rec-btn.loading{background:var(--lavender);box-shadow:none}
.spin{width:17px;height:17px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===================== SCREEN 3: SWIPE ===================== */
#s-swipe{background:var(--cream2)}
.sw-header{
  padding:52px 24px 14px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sw-back{background:none;border:none;font-size:12px;color:var(--ink3);cursor:pointer;letter-spacing:1.5px;padding:0}
.sw-title{font-family:'Noto Serif SC',serif;font-size:17px;color:var(--ink)}
.sw-hint{font-size:11px;color:var(--ink3)}

.card-arena{
  flex:1;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:0 20px;
  overflow:hidden;
}
.food-card{
  position:absolute;
  width:100%;max-width:400px;
  background:var(--white);border-radius:22px;
  box-shadow:0 8px 36px rgba(17,17,8,.12);
  overflow:hidden;cursor:grab;user-select:none;
  will-change:transform;
}
.food-card:active{cursor:grabbing}
.food-card.c2{transform:scale(.95) translateY(12px);z-index:1}
.food-card.c3{transform:scale(.90) translateY(24px);z-index:0}
.food-card.c1{z-index:10}

.card-visual{
  height:190px;display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.card-svg-bg{position:absolute;inset:0;width:100%;height:100%}
.card-emo{font-size:0} /* hide emoji, use SVG art */
.card-art{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

.stamp-nope,.stamp-yep{
  position:absolute;top:18px;padding:7px 14px;border-radius:7px;
  font-size:18px;font-weight:700;opacity:0;z-index:20;pointer-events:none;letter-spacing:2px;
}
.stamp-nope{right:18px;border:2.5px solid var(--red);color:var(--red);transform:rotate(12deg)}
.stamp-yep{left:18px;border:2.5px solid var(--lavender-deep);color:var(--lavender-deep);transform:rotate(-12deg)}

.card-body{padding:18px 20px 20px}
.card-name{font-family:'Noto Serif SC',serif;font-size:21px;font-weight:600;color:var(--ink)}
.card-row{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap}
.ctag{font-size:11px;padding:3px 10px;border-radius:50px;background:var(--lavender-pale);color:var(--lavender-deep);font-weight:500}
.cdist{font-size:12px;color:var(--ink3)}
.cprice{font-size:12px;color:var(--ink3)}
.card-desc{font-size:13px;color:var(--ink2);margin-top:11px;line-height:1.7}
.card-must{margin-top:13px;padding:11px 13px;background:var(--lavender-pale);border-radius:11px;display:flex;gap:7px}
.cm-icon{font-size:13px;flex-shrink:0;margin-top:1px;color:var(--lavender-deep)}
.cm-text{font-size:12px;color:var(--lavender-deep);line-height:1.6}

.sw-actions{
  display:flex;justify-content:center;align-items:center;gap:18px;
  padding:18px 24px 36px;flex-shrink:0;
}
.act{
  border-radius:50%;border:1.5px solid var(--border);background:var(--white);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.07);
  transition:all .15s;flex-shrink:0;
}
.act:active{transform:scale(.88)}
.act-skip{width:52px;height:52px;font-size:20px;color:#C07070}
.act-like{width:66px;height:66px;font-size:26px;color:var(--lavender-deep);border-color:rgba(107,94,199,.3);box-shadow:0 6px 22px rgba(107,94,199,.2)}
.act-detail{width:52px;height:52px;font-size:18px;color:var(--ink3)}

/* Empty */
.sw-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:40px;position:absolute;inset:0}
.sw-empty-icon{font-size:52px}
.sw-empty-t{font-family:'Noto Serif SC',serif;font-size:20px;color:var(--ink);text-align:center}
.sw-empty-s{font-size:13px;color:var(--ink3);text-align:center;line-height:1.7}
.sw-empty-btn{margin-top:8px;padding:12px 30px;background:var(--lavender-deep);color:var(--white);border:none;border-radius:50px;font-size:13px;font-family:'Noto Sans SC',sans-serif;cursor:pointer;letter-spacing:1px}

/* ===================== SCREEN 4: DETAIL (XHS STYLE) ===================== */
#s-detail{background:var(--white);overflow-y:auto}
#s-detail::-webkit-scrollbar{display:none}

.xhs-hero{
  position:relative;height:280px;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
}
.xhs-hero-bg{position:absolute;inset:0;width:100%;height:100%}
.xhs-close{
  position:absolute;top:50px;left:18px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.88);
  border:none;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}
.xhs-save{
  position:absolute;top:50px;right:18px;
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,.88);
  border:none;font-size:16px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
}

.xhs-body{padding:20px 18px 0}
.xhs-name{font-family:'Noto Serif SC',serif;font-size:24px;font-weight:700;color:var(--ink)}
.xhs-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.xhs-chip{
  font-size:12px;padding:4px 12px;border-radius:50px;
  border:1px solid var(--border);color:var(--ink2);
}
.xhs-chip.hot{background:rgba(192,57,43,.07);border-color:rgba(192,57,43,.2);color:var(--red)}

/* Must eat section */
.must-box{margin:18px 0;padding:15px 16px;background:var(--lavender-pale);border-radius:15px}
.must-title{font-size:11px;font-weight:500;color:var(--lavender-deep);letter-spacing:2px;margin-bottom:10px}
.must-row{display:flex;gap:8px;margin-bottom:8px;align-items:flex-start}
.must-row:last-child{margin-bottom:0}
.must-num{width:18px;height:18px;border-radius:50%;background:var(--lavender-deep);color:white;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-weight:500}
.must-t{font-size:13px;color:var(--ink2);line-height:1.6}

/* XHS Reviews */
.xhs-divider{height:8px;background:var(--cream2);margin:18px -18px}
.xhs-reviews-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 12px;
}
.xrt-l{font-family:'Noto Serif SC',serif;font-size:16px;color:var(--ink)}
.xrt-r{font-size:12px;color:var(--ink3)}

.xhs-review{
  background:var(--cream);border-radius:16px;
  padding:0;margin-bottom:12px;overflow:hidden;
}
/* XHS reviewer header */
.xr-head{display:flex;align-items:center;gap:10px;padding:14px 14px 0}
.xr-av{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:white;font-weight:500;flex-shrink:0;
  position:relative;overflow:hidden;
}
.xr-av-ring{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
.xr-info{flex:1}
.xr-name{font-size:13px;font-weight:500;color:var(--ink)}
.xr-follow{font-size:11px;color:var(--ink3);margin-top:1px}
.xr-likes{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--ink3)}
.xr-likes-icon{font-size:14px;color:#E05C5C}

/* XHS stars */
.xr-stars{display:flex;gap:2px;margin:10px 14px 0;align-items:center}
.star-filled{color:#F5A623;font-size:13px}
.star-empty{color:var(--border);font-size:13px}
.xr-score-label{font-size:11px;color:var(--ink3);margin-left:6px}

/* Review text */
.xr-text{font-size:13.5px;color:var(--ink2);line-height:1.75;padding:10px 14px}
.xr-text .hl{color:var(--red);font-weight:500} /* highlight keywords */

/* Review images */
.xr-imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:4px 0 0}
.xr-img{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:28px;overflow:hidden;
}
.xr-img svg{width:100%;height:100%}

/* Tags */
.xr-tags{display:flex;gap:6px;padding:10px 14px 14px;flex-wrap:wrap}
.xr-tag{
  font-size:11px;padding:3px 9px;border-radius:50px;
  background:var(--white);color:var(--ink3);border:1px solid var(--border);
}
.xr-tag.red{background:rgba(192,57,43,.06);color:var(--red);border-color:rgba(192,57,43,.18)}
.xr-tag.green{background:var(--lavender-pale);color:var(--lavender-deep);border-color:rgba(107,94,199,.2)}

/* XHS footer bar */
.xhs-foot{
  position:sticky;bottom:0;background:var(--white);
  border-top:1px solid var(--border);
  padding:12px 18px 28px;
  display:flex;gap:10px;align-items:center;
}
.xhs-comment-input{
  flex:1;padding:9px 14px;border-radius:50px;
  background:var(--cream);border:none;
  font-size:13px;color:var(--ink3);cursor:pointer;
  font-family:'Noto Sans SC',sans-serif;
}
.xhs-action-icon{
  width:38px;height:38px;border-radius:50%;border:none;background:none;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink2);
  transition:transform .15s;
}
.xhs-action-icon:active{transform:scale(.88)}

/* TOAST */
.toast{
  position:fixed;bottom:90px;left:50%;
  transform:translateX(-50%) translateY(12px);
  background:rgba(17,17,8,.88);color:white;
  padding:11px 22px;border-radius:50px;font-size:13px;
  opacity:0;transition:all .3s;z-index:200;
  white-space:nowrap;backdrop-filter:blur(4px);pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ===== S1: SPLASH ===== -->
<div class="screen active" id="s-splash">
  <div class="splash-ambient"><div class="amb1"></div><div class="amb2"></div><div class="amb3"></div></div>
  <div class="splash-grid"></div>

  <div class="splash-center">
    <div class="logo-wrap">
      <div class="logo-rings"><div class="lr3"></div><div class="lr2"></div><div class="lr1"></div></div>
      <!-- Cartoon Western Food Tray Logo -->
      <svg class="logo-mark" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bgGrad" cx="50%" cy="40%" r="55%">
            <stop offset="0%" stop-color="#4A3D8F" stop-opacity="1"/>
            <stop offset="100%" stop-color="#2D2640" stop-opacity="1"/>
          </radialGradient>
          <radialGradient id="plateGrad" cx="50%" cy="35%" r="60%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#E8E4F8"/>
          </radialGradient>
          <radialGradient id="trayGrad" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stop-color="#C8BFFF"/>
            <stop offset="100%" stop-color="#9B8EE8"/>
          </radialGradient>
        </defs>

        <!-- Background circle -->
        <circle cx="55" cy="55" r="54" fill="url(#bgGrad)"/>
        <!-- Subtle ring highlight -->
        <circle cx="55" cy="55" r="53" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>

        <!-- TRAY base (oval, lavender) -->
        <ellipse cx="55" cy="78" rx="36" ry="7" fill="url(#trayGrad)"/>
        <ellipse cx="55" cy="76" rx="36" ry="7" fill="url(#trayGrad)"/>
        <ellipse cx="55" cy="75" rx="36" ry="6.5" fill="#B8AEFF" opacity=".6"/>
        <!-- Tray rim highlight -->
        <ellipse cx="55" cy="74" rx="34" ry="5" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1"/>

        <!-- PLATE (white circle on tray) -->
        <ellipse cx="55" cy="68" rx="26" ry="7.5" fill="#E8E4F8" opacity=".5"/>
        <circle cx="55" cy="60" r="24" fill="url(#plateGrad)"/>
        <!-- Plate inner ring -->
        <circle cx="55" cy="60" r="20" fill="none" stroke="#D8D2F0" stroke-width="1"/>
        <!-- Plate shadow edge -->
        <circle cx="55" cy="60" r="24" fill="none" stroke="#C4BCEE" stroke-width="1.2"/>

        <!-- FOOD on plate -->
        <!-- Steak / main item (brown oval) -->
        <ellipse cx="52" cy="62" rx="13" ry="9" fill="#8B5E3C" opacity=".9"/>
        <ellipse cx="52" cy="61" rx="12" ry="8" fill="#A0724E"/>
        <!-- Steak grill marks -->

// ===== NAVIGATION =====
function go(to, from){
  if(from) document.getElementById(from).classList.remove('active');
  document.getElementById(to).classList.add('active');
}

function toFilter(){
  document.getElementById('s-splash').classList.remove('active');
  document.getElementById('s-filter').classList.add('active');
}
function toSplash(){
  document.getElementById('s-filter').classList.remove('active');
  document.getElementById('s-splash').classList.add('active');
}

// ===== FILTER =====
function toggleTag(btn, cls){
  btn.classList.toggle(cls);
}
function pickPrice(btn){
  document.querySelectorAll('.ptag').forEach(b=>b.classList.remove('on-price'));
  btn.classList.add('on-price');
}

async function submitFilter(){
  const btn = document.getElementById('recBtn');
  const spin = document.getElementById('recSpin');
  const txt = document.getElementById('recTxt');
  btn.classList.add('loading');
  spin.style.display='block';
  txt.textContent='AI 分析中…';
  await new Promise(r=>setTimeout(r,600));
  spin.style.display='none';
  txt.textContent='为我推荐';
  btn.classList.remove('loading');
  // init swipe
  currentIdx = 0;
  currentList = [...restaurants].sort(()=>Math.random()-.5);
  document.getElementById('matchN').textContent = currentList.length;
  renderCards();
  go('s-swipe','s-filter');
}

// ===== SWIPE =====
let currentList = [];
let currentIdx = 0;

function renderCards(){
  const arena = document.getElementById('cardArena');
  arena.innerHTML = '';
  const slice = currentList.slice(currentIdx, currentIdx+3);
  if(!slice.length){
    arena.innerHTML = `<div class="sw-empty">
      <div class="sw-empty-icon">✨</div>
      <div class="sw-empty-t">看完了！</div>
      <div class="sw-empty-s">去找找你种草的那几家吧</div>
      <button class="sw-empty-btn" onclick="go('s-filter','s-swipe')">重新筛选</button>
    </div>`;
    return;
  }
  slice.slice().reverse().forEach((r,i)=>{
    const card = buildCard(r, i===slice.length-1);
    const cls = ['c3','c2','c1'][i+(3-slice.length)];
    card.classList.add(cls||'c1');
    arena.appendChild(card);
    if(i===slice.length-1) attachDrag(card, r);
  });
}

function buildCard(r, isTop){
  const div = document.createElement('div');
  div.className = 'food-card';
  div.innerHTML = `
    <div class="card-visual">
      <div class="card-svg-bg">${cardSVG(r)}</div>
      ${isTop?'<div class="stamp-nope">跳过</div><div class="stamp-yep">种草♥</div>':''}
    </div>
    <div class="card-body">
      <div class="card-name">${r.name}</div>
      <div class="card-row">
        <span class="ctag">${r.tag}</span>
        <span class="cdist">📍${r.dist}</span>
        <span class="cprice">人均${r.price}</span>
        ${r.hot?'<span class="ctag" style="background:rgba(192,57,43,.08);color:var(--red)">🔥热门</span>':''}
      </div>
      <div class="card-desc">${r.desc}</div>
      <div class="card-must">
        <div class="cm-icon">✓</div>
        <div class="cm-text">${r.must[0]}</div>
      </div>
    </div>`;
  return div;
}

function attachDrag(card, data){
  let sx, sy, dragging=false;
  const onStart = e=>{
    const p = e.touches?e.touches[0]:e;
    sx=p.clientX; sy=p.clientY; dragging=false;
    card.style.transition='none';
  };
  const onMove = e=>{
    if(sx==null) return;
    const p = e.touches?e.touches[0]:e;
    const dx=p.clientX-sx, dy=p.clientY-sy;
    if(!dragging&&Math.abs(dx)<4&&Math.abs(dy)<4) return;
    dragging=true; if(e.cancelable) e.preventDefault();
    const rot = dx*.07;
    card.style.transform=`translateX(${dx}px) translateY(${dy*.25}px) rotate(${rot}deg)`;
    const nope=card.querySelector('.stamp-nope'), yep=card.querySelector('.stamp-yep');
    if(nope&&yep){
      if(dx>20){nope.style.opacity=0;yep.style.opacity=Math.min((dx-20)/70,1)}
      else if(dx<-20){yep.style.opacity=0;nope.style.opacity=Math.min((-dx-20)/70,1)}
      else{nope.style.opacity=0;yep.style.opacity=0}
    }
  };
  const onEnd = e=>{
    if(!dragging){sx=null;return;}
    const p = e.changedTouches?e.changedTouches[0]:e;
    const dx = p.clientX - sx;
    card.style.transition='transform .35s cubic-bezier(.4,0,.2,1),opacity .35s';
    if(dx>75) flyOff(card,1,data);
    else if(dx<-75) flyOff(card,-1,data);
    else{
      card.style.transform='';
      const nope=card.querySelector('.stamp-nope'),yep=card.querySelector('.stamp-yep');
      if(nope) nope.style.opacity=0;
      if(yep) yep.style.opacity=0;
    }
    sx=null;
  };
  card.addEventListener('mousedown',onStart);
  document.addEventListener('mousemove',onMove,{passive:false});
  document.addEventListener('mouseup',onEnd);
  card.addEventListener('touchstart',onStart,{passive:true});
  card.addEventListener('touchmove',onMove,{passive:false});
  card.addEventListener('touchend',onEnd);
}

function flyOff(card, dir, data){
  card.style.transform=`translateX(${dir*700}px) rotate(${dir*28}deg)`;
  card.style.opacity='0';
  showToast(dir>0?`已种草 ${data.name} ♥`:'跳过');
  setTimeout(()=>{currentIdx++;renderCards();},340);
}

function swipe(action){
  const arena=document.getElementById('cardArena');
  const card=arena.querySelector('.food-card.c1');
  if(!card) return;
  const data=currentList[currentIdx];
  card.style.transition='transform .35s cubic-bezier(.4,0,.2,1),opacity .35s';
  if(action==='skip'){card.style.transform='translateX(-700px) rotate(-28deg)';card.style.opacity='0';showToast('跳过');}
  else if(action==='like'){card.style.transform='translateX(700px) rotate(28deg)';card.style.opacity='0';showToast(`已种草 ${data.name} ♥`);}
  setTimeout(()=>{currentIdx++;renderCards();},340);
}

// ===== DETAIL =====
let savedState = false;
function toggleSave(){
  savedState=!savedState;
  document.getElementById('xhsSave').textContent=savedState?'❤':'🤍';
  showToast(savedState?'已收藏到种草清单':'已取消收藏');
}

function openDetail(){
  const data=currentList[currentIdx];
  if(!data) return;

  // Hero
  const hero=document.getElementById('xhsHero');
  hero.innerHTML=`
    <div style="position:absolute;inset:0">${cardSVG(data)}</div>
    <button class="xhs-close" onclick="go('s-swipe','s-detail')">←</button>
    <button class="xhs-save" id="xhsSave" onclick="toggleSave()">${savedState?'❤':'🤍'}</button>`;

  // Name + meta
  document.getElementById('xhsName').textContent=data.name;
  document.getElementById('xhsMeta').innerHTML=`
    <span class="xhs-chip">${data.tag}</span>
    <span class="xhs-chip">📍 ${data.dist}</span>
    <span class="xhs-chip">人均 ${data.price}</span>
    ${data.hot?'<span class="xhs-chip hot">🔥 本周热门</span>':''}`;

  // Must eat
  document.getElementById('xhsMust').innerHTML=`
    <div class="must-title">探店须知 · 必看清单</div>
    ${data.must.map((m,i)=>`<div class="must-row"><div class="must-num">${i+1}</div><div class="must-t">${m}</div></div>`).join('')}`;

  // Reviews (XHS style)
  document.getElementById('xhsReviews').innerHTML=data.reviews.map(rv=>`
    <div class="xhs-review">
      <div class="xr-head">
        <div class="xr-av" style="background:${rv.color}">
          <div class="xr-av-ring"></div>
          ${rv.name[0]}
        </div>
        <div class="xr-info">
          <div class="xr-name">${rv.name}</div>
          <div class="xr-follow">${rv.follow}</div>
        </div>
        <div class="xr-likes"><span class="xr-likes-icon">♥</span>${rv.likes}</div>
      </div>
      <div class="xr-stars">
        ${'<span class="star-filled">★</span>'.repeat(rv.score)}${'<span class="star-empty">★</span>'.repeat(5-rv.score)}
        <span class="xr-score-label">${['','','','差','还行','推荐！'][rv.score]}</span>
      </div>
      <div class="xr-text">${rv.text}</div>
      <div class="xr-imgs">${rv.imgs.map(k=>`<div class="xr-img">${reviewImgSVG(k,rv.color)}</div>`).join('')}</div>
      <div class="xr-tags">${rv.tags.map(t=>`<span class="xr-tag ${t.includes('必')||t.includes('鲜')||t.includes('快')?'green':t.includes('慎')||t.includes('踩')?'red':''}">${t}</span>`).join('')}</div>
    </div>`).join('');

  go('s-detail','s-swipe');
  document.getElementById('s-detail').scrollTop=0;
}

// ===== TOAST =====
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}
